<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI Pulse — KONNEKT INTERNATIONAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; background: #fafafa; }
    .pixel-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px; }
    .pixel-cell { aspect-ratio: 1/1; }
    .confetti {
      position: fixed; width: 12px; height: 12px; pointer-events: none;
      animation: fall 5s linear forwards; z-index: 100;
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      80% { opacity: 1; }
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .slide-in { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .typing::after { content: '...'; animation: typing 1.5s infinite; }
    @keyframes typing { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }
    .score-reveal { animation: scoreReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes scoreReveal {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .cat-appear { animation: catAppear 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
    @keyframes catAppear {
      0% { transform: scale(0) rotate(-15deg); opacity: 0; }
      60% { transform: scale(1.2) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .comment-fade { animation: commentFade 1s ease-out 1.5s both; }
    @keyframes commentFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .gentle-float { animation: gentleFloat 3s ease-in-out infinite; }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    /* スマホでナビが折れないように */
    @media (max-width: 640px) {
      .main-nav { flex-direction: row; gap: 0.5rem; }
      .main-nav button { font-size: 0.75rem; padding: 0.5rem 0.75rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">

    const {

    // ============ 6段階猫キャラ定義（v6ピクセルベース） ============
    const CAT_STAGES = [

    const getCatStage = (score) => {
      return CAT_STAGES.find(s => score >= s.minScore && score <= s.maxScore) || CAT_STAGES[0];
    };

    // ============ ピクセルアート描画 ============
    const PixelCat = ({ stage, size = 'md', highlight = false }) => {

      return (

          style={{ backgroundColor: stage.bgColor, borderColor: stage.borderColor }}
        >
          <div className="pixel-grid w-full h-full">
            {stage.pixels.flatMap((row, ri) =>
              row.split('').map((cell, ci) => (

    };

    // ============ サンプルデータ（GAS未設定時のフォールバック） ============
    const SAMPLE_MASTER = {
      names: [
        { name: '由羽 弘明', department: '経営・営業', email: '', active: true, pin: '1111' },
        { name: '小柳 雅裕', department: '経営・営業', email: '', active: true, pin: '1111' },
        { name: '福島 優美', department: 'IPMD・トレンドリサーチ', email: '', active: true, pin: '1111' },
        { name: '引地 瑞生', department: 'IPMD・トレンドリサーチ', email: '', active: true, pin: '1111' },
        { name: '齊藤 マミ', department: 'IPMD・トレンドリサーチ', email: '', active: true, pin: '1111' },
        { name: '川田 嘉悠', department: 'ブランドPM・企画・EC', email: '', active: true, pin: '1111' },
        { name: '小林 準基', department: 'ブランドPM・企画・EC', email: '', active: true, pin: '1111' },
        { name: '菊田 舞', department: 'ブランドPM・企画・EC', email: '', active: true, pin: '1111' },
        { name: '北園 佳樹', department: 'ブランドPM・企画・EC', email: '', active: true, pin: '1111' },
        { name: '山﨑 丈嗣', department: '経営・営業', email: '', active: true, pin: '1111' },
        { name: '藤本 有璃子', department: 'クリエイティブ・デザイン', email: '', active: true, pin: '1111' },
        { name: '高垣 ひなた', department: 'クリエイティブ・デザイン', email: '', active: true, pin: '1111' },
        { name: '植田 尋', department: 'クリエイティブ・デザイン', email: '', active: true, pin: '1111' },
        { name: '青木 和輝', department: '生産・物流・バックオフィス', email: '', active: true, pin: '1111' },
        { name: '井道 桃香', department: '生産・物流・バックオフィス', email: '', active: true, pin: '1111' },
        { name: '佐生 竜輔', department: '生産・物流・バックオフィス', email: '', active: true, pin: '1111' },
        { name: '鈴木 由洋', department: '経営・営業', email: '', active: true, pin: '1111' },
        { name: '秋本 壮', department: '経営・営業', email: '', active: true, pin: '1111' },
      ],
      departments: ['経営・営業','IPMD・トレンドリサーチ','ブランドPM・企画・EC','クリエイティブ・デザイン','生産・物流・バックオフィス'],
      initiatives: [
        { id: 'I001', name: 'Claude × Shopify連携設定', month: '2026-05', detail: 'Shopifyコネクタを社員アカウントで接続', active: true },
        { id: 'I002', name: 'Claude議事録自動化（CircleBack）', month: '2026-05', detail: 'Google Meet→自動議事録', active: true },
        { id: 'I003', name: 'プロンプト集50選 読了', month: '2026-05', detail: '社内ナレッジページを通読', active: true },
      ],
      q5Options: [
        { value: '個人向上', emoji: '📚', label: '個人向上（自分のスキル磨く）', score: 10, active: true },
        { value: 'チーム巻き込み', emoji: '🤝', label: 'チーム巻き込み（広めていく）', score: 10, active: true },
        { value: '新ツール開拓', emoji: '🆕', label: '新ツール開拓（新しい挑戦）', score: 10, active: true },
        { value: '現状維持', emoji: '🌿', label: '現状維持でいい', score: 3, active: true },
      ],
      settings: { '人件費単価_時給': 5000, 'AI月額コスト': 50000 }
    };

    // ============ サンプル回答データ ============
    const SAMPLE_RESPONSES = (() => {
      const out = [];
      const months = ['2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'];
      SAMPLE_MASTER.names.forEach((p, i) => {
        months.forEach((m, mi) => {
          if (Math.random() < 0.85) {
            const base = 30 + (mi * 5) + (i % 6) * 8 + Math.floor(Math.random() * 15);
            out.push({
              timestamp: `${m}-15T10:00:00`,
              month: m,
              name: p.name,
              department: p.department,
              q1: ['ほぼ毎日','週2-3日','週1日','ほぼ使ってない'][Math.floor(Math.random()*4)],
              q2: ['メール作成','議事録','リサーチ','企画書'],
              q3: (Math.floor(Math.random()*15) + 2) * 5, // 0-95% (step 5)
              q4: ['😫','😐','😊','🔥'][Math.floor(Math.random()*4)],
              q5: ['プロンプト改善','新ツール試す','チーム共有','現状維持'][Math.floor(Math.random()*4)],
              q6: ['😫','😐','😊','🔥'][Math.floor(Math.random()*4)],
              q7: i % 3 === 0 ? '議事録自動化でMTG時間が30分→10分になった' : '',
              initiatives: ['I001','I002'],
              didable: '提案資料の初稿をAIに任せられるようになった',
              comment: '',
              score: Math.min(100, Math.max(0, base))
            });
          }
        });
      });
      return out;
    })();

    // ============ ストレージ ============
    const STORAGE_KEY = 'ai-pulse-config';
    const loadConfig = () => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
    };
    const saveConfig = (cfg) => localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));

    // ============ GAS API ============
    const callGas = async (webhookUrl, action, payload = null) => {
      if (!webhookUrl) throw new Error('Webhook URL未設定');
      const url = payload ? webhookUrl : `${webhookUrl}?action=${action}`;
      const opts = payload
        ? { method: 'POST', body: JSON.stringify({ action, ...payload }), headers: {'Content-Type': 'text/plain;charset=utf-8'} }
        : { method: 'GET' };
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    };

    // ============ スコア計算 ============
    const calcScore = (ans, master) => {
      let score = 0;
      score += { 'ほぼ毎日': 25, '週2-3日': 18, '週1日': 10, 'ほぼ使ってない': 3 }[ans.q1] || 0;
      score += Math.min(20, (ans.q2 || []).length * 5);
      score += Math.min(20, Math.round((ans.q3 || 0) / 5));
      score += { '😫': 0, '😐': 5, '😊': 10, '🔥': 15 }[ans.q4] || 0;
      // Q5: マスター（q5Options）からスコア取得・なければフォールバック
      const q5Map = (master?.q5Options || []).reduce((m, o) => { m[o.value] = o.score || 0; return m; }, {});
      const q5Fallback = { '個人向上': 10, 'チーム巻き込み': 10, '新ツール開拓': 10, '現状維持': 3 };
      score += (q5Map[ans.q5] ?? q5Fallback[ans.q5]) || 0;
      score += { '😫': 0, '😐': 3, '😊': 7, '🔥': 10 }[ans.q6] || 0;
      return Math.min(100, Math.max(0, score));
    };

    // ============ 紙吹雪（長め・3波） ============
    const fireConfetti = () => {
      const colors = ['#FFD700','#FF6B6B','#4ECDC4','#95E1D3','#F38181','#AA96DA','#FFB6C1','#87CEEB'];
      const shapes = ['10px', '14px', '8px'];
      const burst = (delay, count) => {
        setTimeout(() => {
          for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '-10px';
            const size = shapes[Math.floor(Math.random() * shapes.length)];
            el.style.width = size;
            el.style.height = size;
            el.style.background = colors[Math.floor(Math.random() * colors.length)];
            el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            el.style.animationDelay = Math.random() * 0.5 + 's';
            el.style.animationDuration = (4 + Math.random() * 2) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 7000);
          }
        }, delay);
      };
      burst(0, 60);     // 第1波
      burst(800, 40);   // 第2波
      burst(2000, 30);  // 第3波
    };

    // ============ Header（ナビ） ============
    const Header = ({ currentView, setView, onAdmin, onExec, onMyPage, currentUser }) => (
      <header className="bg-white border-b sticky top-0 z-50">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <span className="text-2xl">🐱</span>
            <h1 className="font-bold text-lg">AI Pulse</h1>
            <span className="text-xs text-gray-500 hidden sm:inline">KONNEKT INTERNATIONAL</span>
          </div>
          <nav className="main-nav flex items-center gap-2">
            <button
              onClick={() => setView('dashboard')}
              className={`px-3 py-2 rounded-lg text-sm transition ${currentView === 'dashboard' ? 'bg-gray-900 text-white' : 'text-gray-600 hover:bg-gray-100'}`}
            >📊 ダッシュボード</button>
            <button
              onClick={() => setView('survey')}
              className={`px-3 py-2 rounded-lg text-sm transition ${currentView === 'survey' ? 'bg-gray-900 text-white' : 'text-gray-600 hover:bg-gray-100'}`}
            >✏️ チェックイン</button>
            <button
              onClick={onMyPage}
              className={`px-3 py-2 rounded-lg text-sm transition ${currentView === 'mypage' ? 'bg-gray-900 text-white' : 'text-gray-600 hover:bg-gray-100'}`}
              title={currentUser ? `${currentUser.name}のマイページ` : 'マイページ'}
            >👤 マイページ{currentUser && <span className="hidden sm:inline text-xs ml-1 opacity-70">({currentUser.name.split(' ')[0]})</span>}</button>
            <button
              onClick={onAdmin}
              className="ml-2 p-2 rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700"
              title="管理画面"
            >🛠</button>
            <button
              onClick={onExec}
              className="p-2 rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700"
              title="経営層"
            >🔒</button>
          </nav>
        </div>
      </header>
    );

    // ============ 全社ダッシュボード（公開） ============
    const PublicDashboard = ({ responses, master }) => {
      const currentMonth = new Date().toISOString().slice(0,7);
      const thisMonth = responses.filter(r => r.month === currentMonth || r.month === '2026-05');
      const allMonths = [...new Set(responses.map(r => r.month))].sort();
      const last6 = allMonths.slice(-6);

      const avgScore = thisMonth.length ? Math.round(thisMonth.reduce((s,r) => s + r.score, 0) / thisMonth.length) : 0;
      const respCount = thisMonth.length;
      const totalCount = master.names.filter(n => n.active).length;
      const respRate = totalCount ? Math.round(respCount / totalCount * 100) : 0;

      // 部署別
      const deptScores = master.departments.map(d => {
        const m = thisMonth.filter(r => r.department === d);
        return {
          dept: d,
          score: m.length ? Math.round(m.reduce((s,r) => s + r.score, 0) / m.length) : 0,
          count: m.length
        };
      }).sort((a,b) => b.score - a.score);

      // 月次推移
      const monthly = last6.map(m => {
        const ms = responses.filter(r => r.month === m);
        return {
          month: m.slice(5),
          score: ms.length ? Math.round(ms.reduce((s,r) => s + r.score, 0) / ms.length) : 0,
          count: ms.length
        };
      });

      // レベル分布
      const levelDist = CAT_STAGES.map(s => ({
        name: s.name,
        count: thisMonth.filter(r => r.score >= s.minScore && r.score <= s.maxScore).length,
        color: s.pixelColor
      }));

      // ヘビーユーザー率（毎日使用）
      const heavyCount = thisMonth.filter(r => r.q1 === 'ほぼ毎日').length;
      const heavyRate = thisMonth.length ? Math.round(heavyCount / thisMonth.length * 100) : 0;

      // ベストプラクティス
      const bestPractices = thisMonth.filter(r => r.q7 && r.q7.length > 5).slice(0, 5);

      return (
        <div className="max-w-6xl mx-auto px-4 py-6 space-y-6">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <KPI label="全社平均スコア" value={avgScore} unit="pt" color="indigo" />
            <KPI label="今月の回答" value={`${respCount}/${totalCount}`} unit={`回答率${respRate}%`} color="emerald" />
            <KPI label="トップ部署" value={deptScores[0]?.dept || '-'} unit={`${deptScores[0]?.score || 0}pt`} color="amber" />
            <KPI label="ヘビーユーザー率" value={`${heavyRate}%`} unit="毎日活用" color="rose" />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <Card title="📈 月次推移">
              <ResponsiveContainer width="100%" height={240}>
                <LineChart data={monthly}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#eee" />
                  <XAxis dataKey="month" />
                  <YAxis domain={[0,100]} />
                  <Tooltip />
                  <Line type="monotone" dataKey="score" stroke="#6366f1" strokeWidth={3} dot={{ r: 5 }} />
                </LineChart>
              </ResponsiveContainer>
            </Card>

            <Card title="🏆 部署別ランキング">
              <div className="space-y-3">
                {deptScores.map((d, i) => (
                  <div key={d.dept} className="flex items-center justify-between p-3 rounded-lg bg-gray-50">
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="text-xl flex-shrink-0">{['🥇','🥈','🥉','4️⃣','5️⃣'][i] || (i+1)}</span>
                      <span className="font-medium text-sm truncate">{d.dept}</span>
                    </div>
                    <div className="text-right flex-shrink-0 ml-2">
                      <div className="font-bold text-indigo-600">{d.score}pt</div>
                      <div className="text-xs text-gray-500">{d.count}人</div>
                    </div>
                  </div>
                ))}
              </div>
            </Card>
          </div>

          <Card title="💡 今月のベストプラクティス">
            {bestPractices.length === 0 ? (
              <p className="text-gray-400 text-sm">まだベストプラクティスの投稿はありません。</p>
            ) : (
              <div className="space-y-3">
                {bestPractices.map((p, i) => (
                  <div key={i} className="p-3 rounded-lg bg-gradient-to-r from-yellow-50 to-orange-50 border border-yellow-200">
                    <p className="text-sm">{p.q7}</p>
                    <p className="text-xs text-gray-500 mt-1">— {p.department}</p>
                  </div>
                ))}
              </div>
            )}
          </Card>
        </div>
      );
    };

    const KPI = ({ label, value, unit, color }) => {
      const colors = {
        indigo: 'from-indigo-500 to-purple-500',
        emerald: 'from-emerald-500 to-teal-500',
        amber: 'from-amber-500 to-orange-500',
        rose: 'from-rose-500 to-pink-500',
      };
      return (

    const Card = ({ title, children }) => (
      <div className="bg-white rounded-xl border p-5 shadow-sm">

        {children}
      </div>

    // ============ チェックイン（アンケート） ============
    const Survey = ({ master, webhookUrl, onComplete }) => {
      const [step, setStep] = useState(0);
      const [answers, setAnswers] = useState({
        name: '', q1: '', q2: [], q3: 0, q4: '', q4Note: '', q5: '', q6: '', q6Note: '', q7: '',
        initiatives: [], didable: '', comment: ''
      });
      const [submitting, setSubmitting] = useState(false);
      const [result, setResult] = useState(null);
      const [aiComment, setAiComment] = useState('');
      const [aiLoading, setAiLoading] = useState(false);

      const totalSteps = 11;
      const progress = (step / totalSteps) * 100;

      const update = (field, value) => setAnswers(a => ({ ...a, [field]: value }));

      const goNext = () => setStep(s => Math.min(totalSteps, s + 1));
      const goBack = () => setStep(s => Math.max(0, s - 1));

      const submit = async () => {
        setSubmitting(true);
        const score = calcScore(answers, master);
        const stage = getCatStage(score);
        const person = master.names.find(n => n.name === answers.name);
        const payload = {
          ...answers,
          department: person?.department || '不明',
          score,
          timestamp: new Date().toISOString(),
          month: new Date().toISOString().slice(0,7)
        };

        // GAS送信（失敗してもUIは進める）
        if (webhookUrl) {
          try {
            await callGas(webhookUrl, 'submit_response', payload);
          } catch (e) {
            console.warn('送信失敗（ローカルだけ保存）:', e);
          }
        }

        setResult({ score, stage, payload });
        fireConfetti();
        setSubmitting(false);

        // AIコメント生成
        if (webhookUrl) {
          setAiLoading(true);
          try {
            const res = await callGas(webhookUrl, 'generate_cat_comment', { name: answers.name, score, currentMonth: payload.month });
            setAiComment(res.comment || stage.message);
          } catch {
            setAiComment(stage.message);
          } finally {
            setAiLoading(false);
          }
        } else {
          setAiComment(stage.message);
        }
      };

      if (result) {
        return <SurveyResult result={result} aiComment={aiComment} aiLoading={aiLoading} onComplete={onComplete} />;
      }

      return (
        <div className="max-w-2xl mx-auto px-4 py-6">
          <div className="mb-6">
            <div className="flex justify-between items-center mb-2">
              <span className="text-xs text-gray-500">Step {step + 1} / {totalSteps + 1}</span>
            </div>
            <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all" style={{ width: `${progress}%` }} />
            </div>
          </div>

          <div className="bg-white rounded-2xl border p-6 shadow-sm slide-in" key={step}>
            {step === 0 && <NameStep answers={answers} master={master} update={update} onNext={goNext} />}
            {step === 1 && <Q1Step answers={answers} update={update} onNext={goNext} onBack={goBack} />}
            {step === 2 && <Q2Step answers={answers} update={update} onNext={goNext} onBack={goBack} />}
            {step === 3 && <Q3Step answers={answers} update={update} onNext={goNext} onBack={goBack} />}
            {step === 4 && <Q4Step answers={answers} update={update} onNext={goNext} onBack={goBack} />}
            {step === 5 && <Q5Step answers={answers} master={master} update={update} onNext={goNext} onBack={goBack} />}
            {step === 6 && <Q6Step answers={answers} update={update} onNext={goNext} onBack={goBack} />}
            {step === 7 && <Q7Step answers={answers} update={update} onNext={goNext} onBack={goBack} />}
            {step === 8 && <InitiativesStep answers={answers} master={master} update={update} onNext={goNext} onBack={goBack} />}
            {step === 9 && <DidableStep answers={answers} update={update} onNext={goNext} onBack={goBack} />}
            {step === 10 && <CommentStep answers={answers} update={update} onSubmit={submit} onBack={goBack} submitting={submitting} />}

        </div>
      );

    const NameStep = ({ answers, master, update, onNext }) => (

          <label className="block">

            <textarea
              value={answers.q4Note || ''}
              onChange={e => update('q4Note', e.target.value)}
              rows={2}

          <div className="flex justify-between mt-6">
            <button onClick={onBack} className="text-sm text-gray-500">← 戻る</button>

    const Q5Step = ({ answers, master, update, onNext, onBack }) => {

          <div className={`grid gap-3 ${q5Opts.length <= 4 ? 'grid-cols-2' : 'grid-cols-2 sm:grid-cols-3'}`}>

          </div>

            <p className="text-sm text-gray-400 text-center py-4">選択肢が未設定です（管理画面で設定してください）</p>
          )}
          <button onClick={onBack} className="mt-6 text-sm text-gray-500">← 戻る</button>
        </div>
      );
    };

    const Q6Step = ({ answers, update, onNext, onBack }) => {
      const opts = [
        { e: '😫', label: '独占中', detail: '誰にも話してない／聞かれてない' },
        { e: '😐', label: 'チラ話', detail: '雑談レベルで個別にちょっと' },
        { e: '😊', label: 'MTGで共有', detail: 'チームMTGでデモ・共有した' },
        { e: '🔥', label: '展開リード', detail: 'ベスプラとして全社に広めてる' },
      ];
      const choose = v => update('q6', v);

          <div className="grid grid-cols-4 gap-2 mb-3">
            {opts.map(o => (
              <button
                key={o.e}
                onClick={() => choose(o.e)}
                className={`p-3 rounded-2xl border-2 text-3xl transition ${answers.q6 === o.e ? 'border-indigo-500 bg-indigo-50 scale-105' : 'border-gray-200 hover:border-gray-400'}`}
              >{o.e}</button>

          </div>

            {opts.map(o => (
              <div key={o.e} className={`text-center text-[10px] leading-tight transition ${answers.q6 === o.e ? 'text-indigo-700 font-bold' : 'text-gray-500'}`}>

      const { score, stage } = result;
      const [displayScore, setDisplayScore] = useState(0);

      // スコアカウントアップ（0→現在値、約2秒）
      useEffect(() => {
        const duration = 2000;
        const startTime = Date.now();
        const tick = () => {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(1, elapsed / duration);
          // easeOutQuart
          const eased = 1 - Math.pow(1 - progress, 4);
          setDisplayScore(Math.round(score * eased));
          if (progress < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }, [score]);

      return (
        <div className="max-w-2xl mx-auto px-4 py-6">
          <div className="bg-white rounded-2xl border p-8 text-center slide-in">
            <h2 className="text-sm text-gray-500 mb-2">🎉 今月のあなたのスコア</h2>

    const Q5OptionsTab = ({ master, setMaster }) => {
      const [value, setValue] = useState('');
      const [emoji, setEmoji] = useState('');
      const [label, setLabel] = useState('');
      const [score, setScore] = useState(10);

      const add = () => {
        if (!value) return;
        const newOpt = { value, emoji: emoji || '✨', label: label || value, score: parseInt(score) || 0, active: true };
        setMaster(prev => ({ ...prev, q5Options: [...(prev.q5Options || []), newOpt] }));
        setValue(''); setEmoji(''); setLabel(''); setScore(10);
      };
      const toggle = v => setMaster(prev => ({ ...prev, q5Options: (prev.q5Options || []).map(o => o.value === v ? { ...o, active: !o.active } : o) }));
      const remove = v => { if (confirm('削除しますか？')) setMaster(prev => ({ ...prev, q5Options: (prev.q5Options || []).filter(o => o.value !== v) })); };
      const editScore = (v, s) => setMaster(prev => ({ ...prev, q5Options: (prev.q5Options || []).map(o => o.value === v ? { ...o, score: s } : o) }));

      return (

          <div className="space-y-2 mb-4">

              <div key={o.value} className={`p-3 rounded-lg border flex items-center justify-between gap-3 ${o.active ? 'bg-white' : 'bg-gray-50 opacity-60'}`}>
                <div className="flex items-center gap-2 min-w-0 flex-1">
                  <span className="text-2xl flex-shrink-0">{o.emoji}</span>

                  <span className="text-xs text-gray-500">pt</span>
                  <button onClick={() => toggle(o.value)} className="text-xs px-2 py-1 rounded bg-gray-100">{o.active ? '無効化' : '有効化'}</button>
                  <button onClick={() => remove(o.value)} className="text-xs px-2 py-1 rounded bg-red-50 text-red-600">削除</button>

              <input type="text" placeholder="絵文字" value={emoji} onChange={e => setEmoji(e.target.value)} maxLength={3} className="col-span-2 p-2 border rounded text-sm text-center" />

    // ============ 経営層ダッシュボード ============
    const ExecDashboard = ({ master, responses, webhookUrl, onLogout }) => {
      const [aiAnalysis, setAiAnalysis] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [digestText, setDigestText] = useState('');
      const [digestLoading, setDigestLoading] = useState(false);
      const [slackSending, setSlackSending] = useState(false);
      const [pdfGenerating, setPdfGenerating] = useState(false);
      const slideRef = useRef(null);

      const currentMonth = '2026-05';
      const lastMonth = '2026-04';
      const thisM = responses.filter(r => r.month === currentMonth);
      const lastM = responses.filter(r => r.month === lastMonth);

      const totalCount = master.names.filter(n => n.active).length;
      const respRate = totalCount ? Math.round(thisM.length / totalCount * 100) : 0;
      // q3は業務効率化%（0-100）。月160h想定で時間換算
      const PCT_TO_HOURS = 1.6;
      const totalSaved = thisM.reduce((s, r) => s + (r.q3 || 0) * PCT_TO_HOURS, 0);
      const lastSaved = lastM.reduce((s, r) => s + (r.q3 || 0) * PCT_TO_HOURS, 0);
      const avgPct = thisM.length ? Math.round(thisM.reduce((s, r) => s + (r.q3 || 0), 0) / thisM.length) : 0;
      const heavyCount = thisM.filter(r => r.q1 === 'ほぼ毎日').length;
      const heavyRate = thisM.length ? Math.round(heavyCount / thisM.length * 100) : 0;
      const didableCount = thisM.filter(r => r.didable && r.didable.length > 5).length;

      const hourlyRate = master.settings['人件費単価_時給'] || 5000;
      const aiCost = master.settings['AI月額コスト'] || 50000;
      const monthlySaving = totalSaved * hourlyRate;
      const yearlySaving = monthlySaving * 12;
      const roi = aiCost > 0 ? Math.round((monthlySaving - aiCost) / aiCost * 100) : 0;

      // 部署別（q3=% → ×1.6で時間換算）
      const deptStats = master.departments.map(d => {
        const m = thisM.filter(r => r.department === d);
        const saved = m.reduce((s,r) => s + (r.q3 || 0) * PCT_TO_HOURS, 0);
        const cost = saved * hourlyRate;
        const did = m.filter(r => r.didable && r.didable.length > 5).length;
        return { dept: d, count: m.length, saved, cost, did };
      });

      // 施策別実施率
      const initStats = master.initiatives.filter(i => i.active).map(i => {
        const did = thisM.filter(r => (r.initiatives || []).includes(i.id)).length;
        return { name: i.name, did, rate: thisM.length ? Math.round(did / thisM.length * 100) : 0 };
      });

      // 未回答者
      const responded = new Set(thisM.map(r => r.name));
      const unanswered = master.names.filter(n => n.active && !responded.has(n.name));

      // できたこと の声
      const voices = thisM.filter(r => r.didable && r.didable.length > 5).slice(0, 5);

      const generateAi = async () => {
        if (!webhookUrl) {
          setAiAnalysis(`【サンプル分析】
今月の全社合計時短時間は ${totalSaved.toFixed(1)}h（先月比 ${(totalSaved - lastSaved > 0 ? '+' : '')}${(totalSaved - lastSaved).toFixed(1)}h）。
ヘビーユーザー率は ${heavyRate}% で、特に「${deptStats.sort((a,b)=>b.saved-a.saved)[0]?.dept}」部署の貢献が大きい。
施策実施率は最大 ${Math.max(...initStats.map(i=>i.rate), 0)}% で、まだ伸びしろあり。
Webhook URL未設定のため、これはサンプル文です。`);
          return;
        }
        setAiLoading(true);
        try {
          const res = await callGas(webhookUrl, 'generate_exec_analysis', {
            currentMonth, lastMonth, totalSaved, lastSaved, heavyRate, respRate, deptStats, initStats
          });
          setAiAnalysis(res.analysis || 'AI分析を生成できませんでした');
        } catch (e) {
          setAiAnalysis(`エラー: ${e.message}`);
        }
        setAiLoading(false);
      };

      const generateDigest = async () => {
        const summaryFallback = `🐱 AI Pulse 月次ダイジェスト（${currentMonth}）

📊 主要KPI
・合計時短時間：${totalSaved.toFixed(1)}h（先月比 ${totalSaved - lastSaved > 0 ? '+' : ''}${(totalSaved - lastSaved).toFixed(1)}h）
・月間コスト削減：¥${monthlySaving.toLocaleString()}（ROI ${roi > 0 ? '+' : ''}${roi}%）
・回答率：${respRate}%（${thisM.length}/${totalCount}名）
・ヘビーユーザー率：${heavyRate}%

🏆 部署別トップ3
${deptStats.sort((a,b) => b.saved - a.saved).slice(0,3).map((d,i) => `${i+1}. ${d.dept}：${d.saved.toFixed(1)}h（${d.count}名）`).join('\n')}

💡 主な「できるようになったこと」
${voices.slice(0,3).map(v => `・${v.didable}（${v.department}）`).join('\n')}

📎 詳細はダッシュボード参照：${location.origin}${location.pathname}
（AI Pulse / KONNEKT INTERNATIONAL）`;

        if (!webhookUrl) {
          setDigestText(summaryFallback);
          return;
        }
        setDigestLoading(true);
        try {
          const res = await callGas(webhookUrl, 'generate_monthly_digest', {
            currentMonth, totalSaved, lastSaved, monthlySaving, roi, respRate, heavyRate,
            deptStats, initStats, voices, totalCount, responseCount: thisM.length
          });
          setDigestText(res.digest || summaryFallback);
        } catch (e) {
          setDigestText(summaryFallback);
        }
        setDigestLoading(false);
      };

      const downloadPdf = () => {
        if (!slideRef.current) return;
        setPdfGenerating(true);
        const opt = {
          margin: 5,
          filename: `AI_Pulse_${currentMonth}.pdf`,
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        window.html2pdf().set(opt).from(slideRef.current).save().then(() => setPdfGenerating(false));
      };

      const sendToSlack = async () => {
        if (!digestText) { alert('まずダイジェスト本文を生成してください'); return; }
        if (!webhookUrl) { alert('Webhook URL未設定です'); return; }
        if (!confirm('経営層（ゆうさん・小柳さん・引地さん）にSlack DMで送信します。よろしいですか？')) return;
        setSlackSending(true);
        try {
          const res = await callGas(webhookUrl, 'send_to_slack', { message: digestText });
          if (res.ok) alert(`Slack配信完了！\n送信先：${res.sentTo?.join(', ') || '配信先'}`);
          else throw new Error(res.error || '不明なエラー');
        } catch (e) {
          alert(`配信失敗：${e.message}\n（Slack Bot Token・SLACK_RECIPIENTS設定を確認してください）`);
        }
        setSlackSending(false);
      };

      return (
        <div className="bg-gray-50 min-h-screen">
          <div className="max-w-[1600px] mx-auto p-4">
            <div className="flex flex-wrap justify-between items-center gap-2 mb-4 print:hidden">
              <h2 className="text-xl font-bold">🔒 経営層ダッシュボード（{currentMonth}）</h2>
              <div className="flex flex-wrap gap-2">
                <button onClick={generateAi} disabled={aiLoading} className="px-3 py-2 rounded bg-indigo-600 text-white text-sm disabled:opacity-50">
                  {aiLoading ? '生成中...' : '🤖 AI分析'}
                </button>
                <button onClick={generateDigest} disabled={digestLoading} className="px-3 py-2 rounded bg-purple-600 text-white text-sm disabled:opacity-50">
                  {digestLoading ? '生成中...' : '📄 ダイジェスト生成'}
                </button>
                <button onClick={downloadPdf} disabled={pdfGenerating} className="px-3 py-2 rounded bg-rose-600 text-white text-sm disabled:opacity-50">
                  {pdfGenerating ? '書き出し中...' : '⬇️ PDF'}
                </button>
                <button onClick={sendToSlack} disabled={slackSending || !digestText} className="px-3 py-2 rounded bg-emerald-600 text-white text-sm disabled:opacity-50">
                  {slackSending ? '送信中...' : '💬 Slack配信'}
                </button>
                <button onClick={onLogout} className="px-3 py-2 rounded bg-gray-200 text-sm">ログアウト</button>
              </div>
            </div>

            {/* 16:9 横長スライド領域 */}
            <div ref={slideRef} className="bg-white rounded-2xl shadow-lg overflow-hidden" style={{ aspectRatio: '16/9', minHeight: '600px' }}>
              <div className="p-8 h-full grid grid-cols-12 grid-rows-6 gap-4">
                {/* ROIバナー（最上段） */}
                <div className="col-span-12 row-span-1 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl p-4 flex items-center justify-around">
                  <div className="text-center">
                    <div className="text-xs opacity-80">月間コスト削減</div>
                    <div className="text-2xl font-bold">¥{monthlySaving.toLocaleString()}</div>
                  </div>
                  <div className="text-center">
                    <div className="text-xs opacity-80">ROI</div>
                    <div className="text-2xl font-bold">{roi > 0 ? '+' : ''}{roi}%</div>
                  </div>
                  <div className="text-center">
                    <div className="text-xs opacity-80">年間換算削減</div>
                    <div className="text-2xl font-bold">¥{yearlySaving.toLocaleString()}</div>
                  </div>
                  <div className="text-center">
                    <div className="text-xs opacity-80">AI月額コスト</div>
                    <div className="text-2xl font-bold">¥{aiCost.toLocaleString()}</div>
                  </div>
                </div>

                {/* KPI4枚 */}
                <div className="col-span-3 row-span-1 bg-emerald-50 rounded-xl p-3 flex flex-col justify-center">
                  <div className="text-xs text-emerald-700">合計時短時間（今月）</div>
                  <div className="text-3xl font-bold text-emerald-700">{totalSaved.toFixed(1)}h</div>
                  <div className="text-xs text-emerald-600">先月比 {totalSaved - lastSaved > 0 ? '+' : ''}{(totalSaved - lastSaved).toFixed(1)}h</div>
                </div>
                <div className="col-span-3 row-span-1 bg-amber-50 rounded-xl p-3 flex flex-col justify-center">
                  <div className="text-xs text-amber-700">新規創出件数</div>
                  <div className="text-3xl font-bold text-amber-700">{didableCount}</div>
                  <div className="text-xs text-amber-600">「できるようになった」回答</div>
                </div>
                <div className="col-span-3 row-span-1 bg-rose-50 rounded-xl p-3 flex flex-col justify-center">
                  <div className="text-xs text-rose-700">施策実施率（最大）</div>
                  <div className="text-3xl font-bold text-rose-700">{Math.max(...initStats.map(i=>i.rate), 0)}%</div>
                  <div className="text-xs text-rose-600">{initStats.length}施策中</div>
                </div>
                <div className="col-span-3 row-span-1 bg-sky-50 rounded-xl p-3 flex flex-col justify-center">
                  <div className="text-xs text-sky-700">ヘビーユーザー率</div>
                  <div className="text-3xl font-bold text-sky-700">{heavyRate}%</div>
                  <div className="text-xs text-sky-600">毎日活用者 / 回答者</div>
                </div>

                {/* AI分析 */}
                <div className="col-span-6 row-span-2 bg-gradient-to-br from-indigo-50 to-purple-50 rounded-xl p-4 border border-indigo-200 overflow-hidden">
                  <div className="text-xs text-indigo-700 font-bold mb-2">🤖 AI分析コメント（前月比）</div>
                  <div className="text-sm whitespace-pre-wrap overflow-auto" style={{ maxHeight: 180 }}>
                    {aiAnalysis || '「🤖 AI分析を生成」ボタンを押すと、前月比の自然文分析が表示されます。'}
                  </div>
                </div>

                {/* 部署別テーブル */}
                <div className="col-span-6 row-span-2 bg-white rounded-xl p-3 border overflow-auto">
                  <div className="text-xs font-bold mb-2">📊 部署別パフォーマンス</div>
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="border-b text-gray-500">
                        <th className="text-left py-1">部署</th>
                        <th className="text-right">回答</th>
                        <th className="text-right">時短h</th>
                        <th className="text-right">削減¥</th>
                        <th className="text-right">新規</th>
                      </tr>
                    </thead>
                    <tbody>
                      {deptStats.map(d => (
                        <tr key={d.dept} className="border-b">
                          <td className="py-1">{d.dept}</td>
                          <td className="text-right">{d.count}</td>
                          <td className="text-right">{d.saved.toFixed(1)}</td>
                          <td className="text-right">¥{d.cost.toLocaleString()}</td>
                          <td className="text-right">{d.did}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {/* 施策実施率 */}
                <div className="col-span-4 row-span-2 bg-white rounded-xl p-3 border overflow-auto">
                  <div className="text-xs font-bold mb-2">📌 施策別実施率</div>
                  <div className="space-y-2">
                    {initStats.map(i => (
                      <div key={i.name}>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="truncate">{i.name}</span>
                          <span className="font-bold">{i.did}名 ({i.rate}%)</span>
                        </div>
                        <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                          <div className="h-full bg-indigo-500" style={{ width: `${i.rate}%` }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* できたことの声 */}
                <div className="col-span-4 row-span-2 bg-yellow-50 rounded-xl p-3 border border-yellow-200 overflow-auto">
                  <div className="text-xs font-bold mb-2">💬 できるようになったことの声</div>
                  <div className="space-y-2">
                    {voices.length === 0 ? (
                      <p className="text-xs text-gray-400">まだ投稿はありません</p>
                    ) : (
                      voices.map((v, i) => (
                        <div key={i} className="text-xs p-2 bg-white rounded border-l-2 border-yellow-400">
                          <p>{v.didable}</p>
                          <p className="text-gray-500 mt-1">— {v.department}</p>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                {/* 未回答者 */}
                <div className="col-span-4 row-span-2 bg-gray-50 rounded-xl p-3 border overflow-auto">
                  <div className="text-xs font-bold mb-2">⏳ 未回答者（{unanswered.length}名）</div>
                  <div className="space-y-1">
                    {unanswered.length === 0 ? (
                      <p className="text-xs text-emerald-600 font-bold">✨ 全員回答済み！</p>
                    ) : (
                      unanswered.map(u => (
                        <div key={u.name} className="text-xs flex justify-between">
                          <span>{u.name}</span>
                          <span className="text-gray-500">{u.department.slice(0, 6)}</span>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </div>

            {/* ダイジェスト本文プレビュー（Slack配信用・PDFには含まれない） */}
            {digestText && (
              <div className="mt-6 bg-white rounded-2xl border shadow-sm p-5 print:hidden">
                <div className="flex justify-between items-start mb-3">
                  <div>
                    <h3 className="font-bold text-sm">📨 Slack配信用ダイジェスト本文</h3>
                    <p className="text-xs text-gray-500 mt-1">経営層DM（ゆうさん・小柳さん・引地さん）にこの本文が届きます</p>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => { navigator.clipboard.writeText(digestText); alert('コピーしました'); }}
                      className="px-3 py-1.5 rounded bg-gray-100 text-xs hover:bg-gray-200"
                    >📋 コピー</button>
                    <button
                      onClick={() => setDigestText('')}
                      className="px-3 py-1.5 rounded bg-gray-100 text-xs hover:bg-gray-200"
                    >✕ 閉じる</button>
                  </div>
                </div>
                <textarea
                  value={digestText}
                  onChange={e => setDigestText(e.target.value)}
                  rows={14}
                  className="w-full p-3 border rounded-lg text-sm font-mono whitespace-pre-wrap"
                />
                <p className="text-xs text-gray-400 mt-2">※ 本文は手動編集できます。「💬 Slack配信」を押すと、ここに表示されている内容が送信されます。</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ============ マイページ ============
    const MyPage = ({ user, responses, master, onLogout }) => {
      const myResponses = responses
        .filter(r => r.name === user.name)
        .sort((a, b) => a.month.localeCompare(b.month));
      const latest = myResponses[myResponses.length - 1];
      const latestStage = latest ? getCatStage(latest.score) : CAT_STAGES[0];
      const bestScore = myResponses.length ? Math.max(...myResponses.map(r => r.score)) : 0;
      const bestStage = getCatStage(bestScore);
      const avgScore = myResponses.length ? Math.round(myResponses.reduce((s,r) => s + r.score, 0) / myResponses.length) : 0;

      // スコア推移グラフ用
      const trend = myResponses.map(r => ({
        month: r.month.slice(5),
        score: r.score
      }));

      // キャラ成長履歴（重複しないステージのみ）
      const stageHistory = [];
      myResponses.forEach(r => {
        const st = getCatStage(r.score);
        if (!stageHistory.some(h => h.id === st.id)) {
          stageHistory.push({ ...st, firstReachedAt: r.month });
        }
      });

      return (
        <div className="max-w-4xl mx-auto px-4 py-6 space-y-5">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-2xl font-bold">👤 マイページ</h2>
              <p className="text-sm text-gray-500 mt-1">{user.name}（{user.department}）</p>
            </div>
            <button onClick={onLogout} className="text-sm text-gray-500 hover:text-gray-800">ログアウト</button>
          </div>

          {/* 現在のキャラ + ベスト */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <Card title="🐱 いまの相棒にゃんこ">
              <div className="text-center">
                {latest ? (
                  <>
                    <div className="flex justify-center mb-2">
                      <PixelCat stage={latestStage} size="lg" />
                    </div>
                    <div className="font-bold mt-2" style={{ color: latestStage.pixelColor }}>{latestStage.name}</div>
                    <div className="text-xs text-gray-500 mt-1">最新スコア {latest.score}pt（{latest.month}）</div>
                  </>
                ) : (
                  <p className="text-sm text-gray-400 py-8">まだ回答がないにゃ〜</p>
                )}
              </div>
            </Card>

            <Card title="🏆 ベストスコア">
              <div className="text-center py-4">
                <div className="text-5xl font-bold text-amber-500">{bestScore}</div>
                <div className="text-xs text-gray-500 mt-1">/100pt</div>
                {bestScore > 0 && (
                  <div className="mt-3">
                    <div className="text-xs font-medium" style={{ color: bestStage.pixelColor }}>到達ステージ：{bestStage.name}</div>
                  </div>
                )}
              </div>
            </Card>

            <Card title="📊 平均スコア">
              <div className="text-center py-4">
                <div className="text-5xl font-bold text-indigo-500">{avgScore}</div>
                <div className="text-xs text-gray-500 mt-1">過去{myResponses.length}回の平均</div>
              </div>
            </Card>
          </div>

          {/* スコア推移 */}
          {trend.length > 1 && (
            <Card title="📈 あなたのスコア推移">
              <ResponsiveContainer width="100%" height={240}>
                <LineChart data={trend}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#eee" />
                  <XAxis dataKey="month" />
                  <YAxis domain={[0,100]} />
                  <Tooltip />
                  <Line type="monotone" dataKey="score" stroke="#a855f7" strokeWidth={3} dot={{ r: 6 }} />
                </LineChart>
              </ResponsiveContainer>
            </Card>
          )}

          {/* キャラ成長履歴 */}
          {stageHistory.length > 0 && (
            <Card title="🌱 キャラ成長の足あと">
              <div className="flex flex-wrap gap-3 justify-center">
                {stageHistory.map(s => (
                  <div key={s.id} className="text-center" style={{ minWidth: 80 }}>
                    <PixelCat stage={s} size="sm" />
                    <div className="text-xs font-medium mt-1">{s.name}</div>
                    <div className="text-[10px] text-gray-400">{s.firstReachedAt}〜</div>
                  </div>
                ))}
              </div>
              <p className="text-xs text-gray-400 text-center mt-3">いまの相棒は {latestStage.name}🎉</p>
            </Card>
          )}

          {/* 過去の回答一覧 */}
          <Card title="📝 過去の回答">
            {myResponses.length === 0 ? (
              <p className="text-sm text-gray-400 text-center py-4">まだ回答がないにゃ〜</p>
            ) : (
              <div className="space-y-2">
                {[...myResponses].reverse().map((r, i) => {
                  const st = getCatStage(r.score);
                  return (
                    <details key={i} className="rounded-lg border bg-gray-50 hover:bg-white transition">
                      <summary className="p-3 cursor-pointer flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <span className="text-xs text-gray-500">{r.month}</span>
                          <span className="text-sm font-bold" style={{ color: st.pixelColor }}>{st.name}</span>
                        </div>
                        <div className="text-right">
                          <span className="font-bold text-indigo-600">{r.score}pt</span>
                        </div>
                      </summary>
                      <div className="px-3 pb-3 text-xs space-y-1 border-t">
                        <div><span className="text-gray-500">使用頻度：</span>{r.q1}</div>
                        <div><span className="text-gray-500">効率化％：</span>{r.q3}%（約{(r.q3 * 1.6).toFixed(1)}h削減）</div>
                        <div><span className="text-gray-500">成長実感：</span>{r.q4}</div>
                        <div><span className="text-gray-500">来月の方向：</span>{r.q5}</div>
                        {r.q7 && <div><span className="text-gray-500">ベスプラ：</span>{r.q7}</div>}
                        {r.didable && <div><span className="text-gray-500">できたこと：</span>{r.didable}</div>}
                      </div>
                    </details>
                  );
                })}
              </div>
            )}
          </Card>
        </div>
      );
    };

    // ============ マイページログインモーダル ============
    const MyPageLoginModal = ({ master, onSubmit, onCancel }) => {
      const [step, setStep] = useState(1);
      const [name, setName] = useState('');
      const [pin, setPin] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = () => {
        const user = master.names.find(n => n.name === name);
        if (!user) { setError('名前が見つかりません'); return; }
        if (String(user.pin || '1111') !== pin) { setError('PINが違います'); return; }
        onSubmit(user);
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-sm slide-in">
            <h3 className="text-lg font-bold mb-1">👤 マイページにログイン</h3>
            <p className="text-sm text-gray-500 mb-4">自分の回答履歴を見るためにログインしてね</p>

            {step === 1 && (
              <>
                <label className="text-xs text-gray-600 block mb-1">あなたの名前</label>
                <select
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full p-3 border rounded-lg mb-4"
                >
                  <option value="">— 選択 —</option>
                  {master.names.filter(n => n.active).map(n => (
                    <option key={n.name} value={n.name}>{n.name}</option>
                  ))}
                </select>
                <div className="flex gap-2">
                  <button onClick={onCancel} className="flex-1 py-2 rounded bg-gray-100 text-sm">キャンセル</button>
                  <button
                    onClick={() => name && setStep(2)}
                    disabled={!name}
                    className="flex-1 py-2 rounded bg-gray-900 text-white text-sm disabled:opacity-50"
                  >次へ →</button>
                </div>
              </>
            )}

            {step === 2 && (
              <>
                <label className="text-xs text-gray-600 block mb-1">PIN（4桁数字）</label>
                <input
                  type="password"
                  inputMode="numeric"
                  maxLength={4}
                  value={pin}
                  onChange={e => { setPin(e.target.value.replace(/[^0-9]/g, '')); setError(''); }}
                  onKeyDown={e => e.key === 'Enter' && handleSubmit()}
                  placeholder="••••"
                  className="w-full p-3 border rounded-lg mb-2 text-center text-2xl tracking-widest font-mono"
                  autoFocus
                />
                {error && <p className="text-xs text-red-500 mb-2">{error}</p>}
                <p className="text-xs text-gray-400 mb-4">初期PINは「1111」だよ。忘れたらゆりこさんに連絡してね</p>
                <div className="flex gap-2">
                  <button onClick={() => { setStep(1); setPin(''); setError(''); }} className="flex-1 py-2 rounded bg-gray-100 text-sm">← 戻る</button>
                  <button onClick={handleSubmit} disabled={pin.length < 4} className="flex-1 py-2 rounded bg-gray-900 text-white text-sm disabled:opacity-50">ログイン</button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    // ============ ログインモーダル ============
    const LoginModal = ({ title, onSubmit, onCancel }) => {
      const [pw, setPw] = useState('');
      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-sm">
            <h3 className="text-lg font-bold mb-1">🔒 {title}</h3>
            <p className="text-sm text-gray-500 mb-4">パスワードを入力してください</p>
            <input
              type="password"
              value={pw}
              onChange={e => setPw(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && onSubmit(pw)}
              className="w-full p-3 border rounded-lg"
              autoFocus
            />
            <div className="flex gap-2 mt-4">
              <button onClick={onCancel} className="flex-1 py-2 rounded bg-gray-100 text-sm">キャンセル</button>
              <button onClick={() => onSubmit(pw)} className="flex-1 py-2 rounded bg-gray-900 text-white text-sm">ログイン</button>
            </div>
          </div>
        </div>
      );
    };

    // ============ ルート ============
    const App = () => {
      const [view, setView] = useState('dashboard');
      const [master, setMaster] = useState(SAMPLE_MASTER);
      const [responses, setResponses] = useState(SAMPLE_RESPONSES);
      const [webhookUrl, setWebhookUrl] = useState('');
      const [loginMode, setLoginMode] = useState(null); // 'admin' | 'exec' | 'mypage' | null
      const [adminAuth, setAdminAuth] = useState(false);
      const [execAuth, setExecAuth] = useState(false);
      const [currentUser, setCurrentUser] = useState(null); // マイページのログインユーザー

      // 初期ロード（localStorageからwebhookUrl復元・GAS取得）
      useEffect(() => {
        const cfg = loadConfig();
        if (cfg.webhookUrl) {
          setWebhookUrl(cfg.webhookUrl);
          // GASから最新マスター取得
          callGas(cfg.webhookUrl, 'get_master').then(d => {
            if (d?.names) setMaster(d);
          }).catch(e => console.warn('GAS取得失敗・サンプル使用:', e));
          callGas(cfg.webhookUrl, 'get_dashboard').then(d => {
            if (d?.responses) setResponses(d.responses);
          }).catch(() => {});
        }
      }, []);

      const persistWebhook = (url) => {
        setWebhookUrl(url);
        saveConfig({ webhookUrl: url });
      };

      const persistMaster = (newM) => {
        const next = typeof newM === 'function' ? newM(master) : newM;
        setMaster(next);
        if (webhookUrl) {
          callGas(webhookUrl, 'update_master', { master: next, password: 'admin2026' })
            .catch(e => console.warn('保存失敗:', e));
        }
      };

      const handleAdminLogin = (pw) => {
        const correct = master.settings['ADMIN_PASSWORD'] || 'admin2026';
        if (pw === correct) {
          setAdminAuth(true);
          setLoginMode(null);
          setView('admin');
        } else alert('パスワードが違います');
      };
      const handleExecLogin = (pw) => {
        const correct = master.settings['EXEC_PASSWORD'] || 'exec2026';
        if (pw === correct) {
          setExecAuth(true);
          setLoginMode(null);
          setView('exec');
        } else alert('パスワードが違います');
      };

      return (
        <div className="min-h-screen">
          <Header
            currentView={view}
            setView={setView}
            currentUser={currentUser}
            onAdmin={() => adminAuth ? setView('admin') : setLoginMode('admin')}
            onExec={() => execAuth ? setView('exec') : setLoginMode('exec')}
            onMyPage={() => currentUser ? setView('mypage') : setLoginMode('mypage')}
          />

          {view === 'dashboard' && <PublicDashboard responses={responses} master={master} />}
          {view === 'survey' && <Survey master={master} webhookUrl={webhookUrl} onComplete={() => setView('dashboard')} />}
          {view === 'mypage' && currentUser && (
            <MyPage
              user={currentUser}
              responses={responses}
              master={master}
              onLogout={() => { setCurrentUser(null); setView('dashboard'); }}
            />
          )}
          {view === 'admin' && adminAuth && (
            <AdminPanel
              master={master}
              setMaster={persistMaster}
              webhookUrl={webhookUrl}
              setWebhookUrl={persistWebhook}
              onLogout={() => { setAdminAuth(false); setView('dashboard'); }}
            />
          )}
          {view === 'exec' && execAuth && (
            <ExecDashboard
              master={master}
              responses={responses}
              webhookUrl={webhookUrl}
              onLogout={() => { setExecAuth(false); setView('dashboard'); }}
            />
          )}

          {loginMode === 'admin' && <LoginModal title="管理画面ログイン" onSubmit={handleAdminLogin} onCancel={() => setLoginMode(null)} />}
          {loginMode === 'exec' && <LoginModal title="経営層ダッシュボード" onSubmit={handleExecLogin} onCancel={() => setLoginMode(null)} />}
          {loginMode === 'mypage' && (
            <MyPageLoginModal
              master={master}
              onSubmit={(user) => { setCurrentUser(user); setLoginMode(null); setView('mypage'); }}
              onCancel={() => setLoginMode(null)}
            />
          )}

          {!webhookUrl && (
            <div className="fixed bottom-4 right-4 bg-yellow-100 border border-yellow-300 rounded-lg p-3 text-xs max-w-xs shadow-lg print:hidden">
              💡 サンプルデータで動作中。実データに切り替えるには右上🛠から Webhook URL を設定してね。
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
